# Configuración de MySQL con variables de entorno de Railway
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Ajustes de memoria para Railway (se cobra por RAM usada)
# Pool de conexiones chico: el tráfico de la tienda no necesita 10 conexiones abiertas
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# Menos hilos de Tomcat (por defecto 200)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor (opcional, por defecto es 8080)
server.port=8080

